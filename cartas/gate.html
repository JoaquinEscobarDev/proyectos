<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartas 💌</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#12080d" />
  <style>
    :root {
      --bg: #12080d; --bg2: #1d1016; --borde: #3a2230;
      --texto: #f5e9ee; --texto2: #9a7f8b; --rosa: #ff6d9d; --error: #ff5470;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(ellipse at 50% 20%, #241019 0%, var(--bg) 60%);
      color: var(--texto);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .sobre {
      text-align: center;
      max-width: 380px;
      width: 100%;
      animation: aparecer .8s ease both;
    }
    .emoji { font-size: 4rem; animation: latido 2.4s ease-in-out infinite; display: inline-block; }
    h1 { font-size: 1.5rem; margin: 1rem 0 .4rem; }
    .sub { color: var(--texto2); font-size: .95rem; margin-bottom: 1.8rem; }
    form { display: flex; flex-direction: column; gap: .8rem; }
    input {
      background: var(--bg2);
      border: 1px solid var(--borde);
      border-radius: 12px;
      padding: .9rem 1.1rem;
      color: var(--texto);
      font-size: 1rem;
      text-align: center;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--rosa); }
    button {
      background: var(--rosa);
      border: none;
      border-radius: 12px;
      padding: .9rem;
      color: #2a0714;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, filter .15s;
    }
    button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .error {
      color: var(--error);
      font-size: .88rem;
      margin-top: .9rem;
      animation: aparecer .4s ease both;
    }
    .volver { display: inline-block; margin-top: 2rem; color: var(--texto2); font-size: .85rem; text-decoration: none; }
    .volver:hover { color: var(--rosa); }
    @keyframes aparecer { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .sobre, .emoji, .error { animation: none; } }
  </style>
</head>
<body>
  <div class="sobre">
    <span class="emoji">💌</span>
    <h1>Cartas</h1>
    <p class="sub">Este rincón es solo para una persona.<br />Si eres tú, ya sabes la clave.</p>
    <form method="POST" action="/cartas/acceso">
      <input type="password" name="clave" placeholder="La clave…" autocomplete="off" autofocus required />
      <button type="submit">Abrir 💝</button>
    </form>
    <!--ERROR-->
    <a class="volver" href="/">← volver a proyectos.fun</a>
  </div>
</body>
</html>
